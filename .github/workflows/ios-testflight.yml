name: iOS → TestFlight

# Builds the member app in the EAS cloud and submits it to TestFlight.
# Needs the EXPO_TOKEN repository secret, and one interactive `eas build --platform ios` run first
# so EAS holds the Apple credentials and App Store Connect API key.
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
